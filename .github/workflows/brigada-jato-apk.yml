name: Brigada Jato - APK Android

on:
  push:
    paths:
      - "BrigadaJato/**"
      - ".github/workflows/brigada-jato-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrigadaJato
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes do jogo (simulacao com bots)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon core:test

      - name: Gerar APK (debug) e versao de PC
        run: ./gradlew --no-daemon android:assembleDebug desktop:dist

      - name: Renomear APK
        run: cp android/build/outputs/apk/debug/android-debug.apk BrigadaJato.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: BrigadaJato-APK
          path: BrigadaJato/BrigadaJato.apk

      - name: Enviar versao de PC
        uses: actions/upload-artifact@v4
        with:
          name: BrigadaJato-PC
          path: BrigadaJato/desktop/build/libs/BrigadaJato-PC.jar
