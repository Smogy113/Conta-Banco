name: Brigada Jato - APK Android

on:
  push:
    paths:
      - "BrigadaJato/**"
      - ".github/workflows/brigada-jato-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrigadaJato
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes do jogo (simulacao com bots)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon core:test

      - name: Gerar APK (debug) e versao de PC
        run: ./gradlew --no-daemon android:assembleDebug desktop:dist

      - name: Renomear e conferir o APK
        run: |
          cp android/build/outputs/apk/debug/android-debug.apk BrigadaJato.apk
          ls -la BrigadaJato.apk
          unzip -l BrigadaJato.apk | grep -E "lib/(arm64-v8a|armeabi-v7a)/libgdx.so"
          unzip -l BrigadaJato.apk | grep -E "lib/arm64-v8a/libgdx-freetype.so"
          unzip -l BrigadaJato.apk | grep -E "assets/maps/fortaleza.txt"
          unzip -l BrigadaJato.apk | grep -E "assets/sfx/explosion.wav"
          unzip -l BrigadaJato.apk | grep -E "assets/fonts/ui.ttf"
          unzip -l BrigadaJato.apk | grep -E "assets/fonts/title.ttf"
          unzip -l BrigadaJato.apk | grep -E "assets/sfx/kill5.wav"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: BrigadaJato-APK
          path: BrigadaJato/BrigadaJato.apk

      - name: Enviar versao de PC
        uses: actions/upload-artifact@v4
        with:
          name: BrigadaJato-PC
          path: BrigadaJato/desktop/build/libs/BrigadaJato-PC.jar

      # Rodando manualmente (workflow_dispatch), salva o APK na pasta apk/ do branch
      # para dar para baixar direto pelo celular.
      - name: Salvar APK no branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ../apk
          cp BrigadaJato.apk ../apk/BrigadaJato.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/BrigadaJato.apk
          git commit -m "APK do Brigada Jato gerado pelo GitHub Actions [skip ci]" || echo "APK sem mudancas"
          git push origin HEAD:${{ github.ref_name }}
